<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>星衍 LifeVerse · 人生轨迹推演空间</title>
  <style>
:root {
  --bg: #f7f8fc;
  --panel: #ffffff;
  --ink: #1a1d2e;
  --muted: #6b7280;
  --line: #e7e9f2;
  --accent: #4f46e5;
  --accent-light: #eef0ff;
  --family: #d97706;
  --work: #0ea5e9;
  --cohort: #94a3b8;
  --echo: #e11d48;
  --radius: 14px;
  --shadow: 0 8px 30px rgba(31, 38, 95, 0.08);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
}
#bgStarNet {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ===== 顶栏 ===== */
.topbar {
  position: relative; z-index: 3;
  height: 58px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px;
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { color: var(--accent); font-size: 20px; }
.brand-name { font-weight: 800; font-size: 19px; letter-spacing: .5px; }
.brand-name em { font-style: normal; color: var(--accent); font-weight: 700; }
.brand-tag { color: var(--muted); font-size: 12px; }
.icon-btn {
  border: 1px solid var(--line); background: #fff; border-radius: 10px;
  width: 38px; height: 34px; cursor: pointer; font-size: 16px;
}
.icon-btn:hover { border-color: var(--accent); }

/* ===== 布局 ===== */
.layout { position: relative; z-index: 2; display: flex; height: calc(100vh - 58px); }
.sidenav {
  width: 220px; flex-shrink: 0; padding: 18px 12px;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(255, 255, 255, 0.6);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  text-align: left; padding: 11px 14px;
  border: 1px solid transparent; border-radius: 10px;
  background: transparent; color: var(--ink); cursor: pointer;
  font-size: 14px; font-weight: 600; transition: .15s;
}
.nav-item:hover { background: #fff; }
.nav-item.active { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); color: var(--accent); }
.nav-idx {
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: var(--accent-light); border-radius: 6px; padding: 2px 6px;
}
.nav-item.active .nav-idx { color: var(--accent); }

.stage { flex: 1; overflow-y: auto; padding: 24px 30px 40px; min-height: 0; }

/* ===== 通用 ===== */
.mod-canvas { width: 100%; display: block; background: linear-gradient(180deg, #fbfbff, #f2f3fb); border: 1px solid var(--line); border-radius: var(--radius); }
.muted { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0; line-height: 1.6; }
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); }

.module-head { margin-bottom: 18px; }
.module-head h1 { font-size: 24px; margin: 0 0 6px; }
.module-head p { color: var(--muted); margin: 0; font-size: 14px; }

/* ===== 模块1 星云 ===== */
.nebula-stage { width: 100%; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.nebula-canvas-wrap { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); flex: 1 1 auto; min-height: 340px; }
.meter { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 14px; }
.meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--work)); transition: width .4s; }
.meter-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
.grav-row { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.grav-chip {
  border: 1px dashed var(--family); color: var(--family);
  padding: 9px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600;
  background: #fffdf7; transition: .15s;
}
.grav-chip:hover { background: #fff7e9; }
.grav-chip.done { border-style: solid; background: #ecfdf5; color: #059669; border-color: #059669; }

/* ===== 模块2/7/8 星图 ===== */
.starmap-stage { width: 100%; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.starmap-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.starmap-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.dynasty-tab {
  border: 1px solid var(--line); background: #fff; border-radius: 9px;
  padding: 8px 13px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.dynasty-tab:hover { border-color: var(--accent); }
.dynasty-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.starmap-canvas-wrap { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; touch-action: none; flex: 1 1 auto; min-height: 360px; }
/* 关系编辑 / 视图切换 按钮 */
.dyn-btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 8px 13px; cursor: pointer; font-size: 13px; font-weight: 600; }
.dyn-btn:hover { border-color: var(--accent); }
.dyn-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.view-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.view-opt { border: none; background: #fff; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.view-opt.active { background: var(--accent); color: #fff; }
/* 扇形决策菜单 */
.fan-menu { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 5; }
.fan-item {
  position: absolute; transform: translate(-50%, -50%); pointer-events: auto;
  border: 1px solid var(--accent); background: #fff; color: var(--accent);
  padding: 7px 12px; border-radius: 18px; cursor: pointer; font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow); white-space: nowrap; transition: .12s;
}
.fan-item:hover { background: var(--accent); color: #fff; transform: translate(-50%, -50%) scale(1.08); }
/* 阻尼滑条 */
.damp-box { position: absolute; transform: translate(-50%, -50%); display: none; z-index: 6;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); width: 150px; }
.damp-title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.damp-range { width: 100%; }
.damp-val { font-size: 12px; color: var(--muted); margin-top: 4px; }
.damp-close { position: absolute; top: 4px; right: 6px; border: none; background: transparent; cursor: pointer; color: var(--muted); font-size: 13px; }
.ripple-log {
  margin-top: 14px; max-height: 220px; overflow-y: auto;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
}
.rl-item { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.rl-item:last-child { border-bottom: none; }
.rl-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; margin-right: 8px; font-weight: 700; }
.rl-friction { color: var(--echo); font-weight: 700; }

/* ===== 模块3 双生 ===== */
.twin-stage { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; width: 100%; min-height: 100%; align-items: stretch; }
.twin-canvas-wrap { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); min-height: 420px; }
.reso-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.reso-pill {
  border: 1px solid var(--line); background: #fff; border-radius: 18px;
  padding: 7px 13px; cursor: pointer; font-size: 12px; font-weight: 600;
}
.reso-pill.active { background: #fff7e9; border-color: var(--family); color: var(--family); }
.vec-matrix { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.vec-matrix h4 { margin: 0 0 4px; }
.mx-slider-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 13px; }
.mx-slider-row label { width: 130px; color: var(--muted); flex-shrink: 0; }
.mx-slider { flex: 1; }
.matrix { margin-top: 14px; border-top: 1px solid var(--line); }
.matrix-row { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px dashed var(--line); font-size: 13px; }
.mx-name { font-weight: 600; }
.mx-val { color: var(--accent); font-weight: 700; }

/* ===== 模块4 退休 ===== */
.retire-stage { display: grid; grid-template-columns: 320px 1fr; gap: 24px; width: 100%; min-height: 100%; align-items: start; }
.retire-form { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); height: fit-content; }
.retire-form label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
.retire-form input, .retire-form select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; }
.flex-row { display: flex; align-items: center; gap: 10px; }
.flex-row input[type=range] { flex: 1; }
#rt_calc { width: 100%; margin-top: 16px; }
.retire-result .clock-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.clock-big { font-size: 30px; font-weight: 800; color: var(--accent); }
.age-text { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
.clock-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.clock-grid > div { background: var(--bg); border-radius: 10px; padding: 12px; }
.clock-grid .k { display: block; font-size: 12px; color: var(--muted); }
.clock-grid span:not(.k) { font-size: 18px; font-weight: 700; }
.insight { margin-top: 16px; background: var(--accent-light); border-radius: 10px; padding: 14px; font-size: 13px; line-height: 1.7; }

/* ===== 模块5 探针 ===== */
.probe-stage { width: 100%; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.probe-canvas-wrap { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); flex: 1 1 auto; min-height: 320px; }
/* 光阴探针轨道（可拖手柄） */
.probe-track { position: relative; height: 30px; margin-top: 18px; border-radius: 16px;
  background: linear-gradient(90deg, #eef0ff, #e0f2fe); border: 1px solid var(--line); touch-action: none; cursor: pointer; }
.probe-track-fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); border-radius: 16px 0 0 16px; background: rgba(79,70,229,0.18); }
.probe-head { position: absolute; left: var(--p, 0%); top: 50%; transform: translate(-50%, -50%);
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  cursor: grab; box-shadow: 0 2px 8px rgba(79,70,229,0.4); user-select: none; }
.probe-head:active { cursor: grabbing; }
.probe-controls { margin-top: 14px; }
.probe-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.probe-year { color: var(--accent); font-weight: 700; }
.probe-slider { width: 100%; }
#btnSplit { margin-top: 12px; }
.split-wrap { grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.split-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.split-panel h4 { margin: 0 0 6px; }

/* ===== 模块6 报告 ===== */
.report-stage { width: 100%; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.report-head h2 { margin: 0 0 4px; }
.report-sec { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-top: 16px; box-shadow: var(--shadow); }
.report-sec h3 { margin: 0 0 12px; font-size: 16px; color: var(--accent); }
.report-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.rc-card { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.rc-k { font-size: 12px; color: var(--muted); }
.rc-v { font-size: 15px; font-weight: 700; margin-top: 3px; }
.report-list { margin: 8px 0; padding-left: 18px; line-height: 1.9; font-size: 14px; }
.report-foot { text-align: center; color: var(--muted); margin-top: 26px; font-size: 13px; }

/* ===== 顶部叙事提示条（L1 · 三.3 动态叙事） ===== */
.narrative-bar {
  position: relative; z-index: 2; height: 38px; display: flex; align-items: center; gap: 10px;
  padding: 0 22px; background: linear-gradient(90deg, #eef0ff, #e0f2fe);
  border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink);
}
.nar-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; box-shadow: 0 0 0 4px rgba(79,70,229,0.15); animation: narr 1.6s infinite; }
@keyframes narr { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
#narrativeText { line-height: 1.4; }

/* ===== 分层音效面板 ===== */
.audio-panel {
  position: absolute; top: 46px; right: 12px; z-index: 20;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 7px; width: 160px;
}
.audio-panel .ap-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.audio-panel label { font-size: 13px; display: flex; align-items: center; gap: 7px; cursor: pointer; }

/* ===== 语音提示气泡 ===== */
.voice-tip {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 40;
  background: rgba(26,29,46,0.92); color: #fff; padding: 9px 16px; border-radius: 20px;
  font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}
.icon-btn.rec { background: var(--echo); color: #fff; border-color: var(--echo); animation: recp 1s infinite; }
@keyframes recp { 0%,100% { box-shadow: 0 0 0 0 rgba(225,29,72,0.5); } 50% { box-shadow: 0 0 0 6px rgba(225,29,72,0); } }

/* ===== 模块2/7/8 星体状态色标（L1 · 三.3） ===== */
.legend .st-core { background: #4f46e5; }
.legend .st-inf { background: #0ea5e9; }
.legend .st-pot { background: #d97706; }
.legend .st-conf { background: #e11d48; }

/* ===== 模块3 双生分屏分割线（L1 · 二.3） ===== */
.twin-canvas-wrap { position: relative; }
.twin-divider {
  position: absolute; top: 8px; bottom: 8px; width: 4px; transform: translateX(-50%);
  background: rgba(120,120,140,0.35); border-radius: 4px; cursor: ew-resize; z-index: 4;
}
.twin-divider::after { content: '⇆'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; background: var(--accent); border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

/* ===== 模块4 退休可拖磁块（L1 · 四.2） ===== */
.retire-magnet { margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.retire-magnet h4 { margin: 0 0 10px; font-size: 14px; }
.mag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.mag-block {
  border: 1px solid var(--accent); background: var(--accent-light); color: var(--accent);
  padding: 8px 13px; border-radius: 16px; cursor: grab; font-size: 13px; font-weight: 700; user-select: none;
}
.mag-block:active { cursor: grabbing; }
.mag-block.pay { border-color: var(--work); background: #e0f2fe; color: var(--work); }
.drop-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.drop-slot {
  border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center;
  font-size: 13px; color: var(--muted); background: var(--bg); transition: .15s;
}
.drop-slot.over { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

/* ===== 模块6 报告联动跳转 + 维度筛选（L1 · 六） ===== */
.filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
.filter-chip {
  border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 6px 13px;
  cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted);
}
.filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.report-sec.dim { opacity: .45; }
.rl-item.clickable { cursor: pointer; }
.rl-item.clickable:hover { background: var(--accent-light); }
.jump-btn { margin-top: 10px; }

/* ===== 全局 HUD（顶栏探针年 + 完整度环 + 侧栏状态点） ===== */
.hud-badge { margin-left: 12px; display: inline-flex; align-items: center; gap: 8px; }
.hud-year { font-size: 12px; color: var(--muted); background: var(--accent-light); border-radius: 10px; padding: 3px 9px; }
.hud-ring { font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 50%; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; }
.nav-item { position: relative; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; margin-left: auto; flex-shrink: 0; background: var(--line); }
.nav-dot.ok { background: #059669; }
.nav-dot.conf { background: var(--echo); box-shadow: 0 0 0 3px rgba(225,29,72,0.18); }
.narrative-bar.echo { border-bottom: 2px solid var(--echo); }
.narrative-bar.echo #narrativeText { color: var(--echo); }

/* ===== 星图扇形情境卡 ===== */
.fan-item { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 96px; padding: 8px 12px; }
.fan-item .fi-main { font-weight: 700; }
.fan-item .fi-sub { font-size: 10px; font-weight: 500; opacity: .85; white-space: nowrap; }
.fan-item.fan-locked { border-color: var(--line); color: var(--muted); background: #f4f5f9; }

/* ===== 涟漪日志故事句 ===== */
.rl-story { line-height: 1.7; }

/* ===== 探针事件钉 ===== */
.probe-pins { position: absolute; inset: 0; pointer-events: none; }
.probe-pin { position: absolute; top: -3px; width: 2px; height: 36px; transform: translateX(-50%); pointer-events: auto; cursor: pointer; border-radius: 2px; }
.probe-pin.pin-dec { background: var(--accent); }
.probe-pin.pin-retire { background: var(--family); }
.probe-pin.pin-policy { background: var(--muted); height: 22px; top: 4px; opacity: .7; }

/* ===== 星云可编辑芯片 / 隐藏维度 / 命运种子 ===== */
.chip-pop { position: absolute; left: 24px; top: 120px; z-index: 8; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; width: 190px; }
.chip-pop .pop-title { font-size: 12px; font-weight: 700; color: var(--muted); }
.chip-pop .pop-opt { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
.chip-pop .pop-opt:hover { border-color: var(--accent); }
.hidden-chip { border-style: dotted; opacity: .8; }
.hidden-row { margin-top: 4px; }
.fear-input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; margin-top: 6px; }
.redo-row { display: flex; gap: 10px; margin-top: 10px; }
.redo-row .btn { font-size: 13px; }

/* ===== 报告编年体 + 十年信 + 导出仪式 ===== */
.chrono-list { list-style: none; padding: 0; margin: 6px 0; }
.chrono-item { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px dashed var(--line); font-size: 13px; }
.chrono-item.hidden-out { opacity: .35; text-decoration: line-through; }
.ch-year { font-weight: 800; color: var(--accent); width: 52px; flex-shrink: 0; }
.ch-evt { flex: 1; }
.ch-reach { color: var(--muted); font-size: 12px; }
.ch-flag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(225,29,72,0.10); color: var(--echo); }
.ch-flag.ok { background: rgba(5,150,105,0.12); color: #059669; }
.ch-hide { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
.letter-ta { width: 100%; min-height: 84px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; font-family: inherit; line-height: 1.6; resize: vertical; }

// 工具：canvas 适配 + 动画循环
function fitCanvas(canvas, height) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width;
  const H = height || rect.height || 300;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W, H, dpr };
}

// 自适应：画布高度随父容器（flex 子项）伸缩，消除大屏写死高度导致的留白
function fitCanvasFlex(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const W = rect.width;
  const H = Math.max(240, wrap.clientHeight || rect.height || 320);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W, H, dpr };
}

// 返回 { stop } 的 rAF 循环
function rafLoop(step) {
  let id = 0;
  let running = true;
  function tick() {
    if (!running) return;
    step();
    id = requestAnimationFrame(tick);
  }
  id = requestAnimationFrame(tick);
  return {
    stop() { running = false; cancelAnimationFrame(id); }
  };
}

function onResize(cb) {
  window.addEventListener('resize', cb);
  return () => window.removeEventListener('resize', cb);
}

__lx_exp["fitCanvas"] = fitCanvas;
__lx_exp["fitCanvasFlex"] = fitCanvasFlex;
__lx_exp["rafLoop"] = rafLoop;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const k in props) {
    if (k === 'class') node.className = props[k];
    else if (k === 'html') node.innerHTML = props[k];
    else if (k === 'text') node.textContent = props[k];
    else if (k.startsWith('on') && typeof props[k] === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), props[k]);
    } else if (k === 'style' && typeof props[k] === 'object') {
      Object.assign(node.style, props[k]);
    } else if (props[k] != null) {
      node.setAttribute(k, props[k]);
    }
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });

}
